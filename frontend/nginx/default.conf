server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Assets do Vite têm hash no nome: podem ser cacheados "para sempre".
    # Arquivo inexistente -> 404 de verdade (nunca o index.html no lugar de um .js/.css).
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fallback de SPA: rotas do React Router (/dashboard, /transactions/new...) caem no index.html.
    # O index.html nunca é cacheado, para um novo deploy valer na hora.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
