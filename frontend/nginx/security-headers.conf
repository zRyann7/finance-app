# Incluído em cada "location" (o add_header de um location substitui os do nível acima).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Diretivas que a <meta> CSP (gerada no build pelo vite.config.js) não consegue aplicar.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS só faz sentido atrás de HTTPS. Ative quando o TLS terminar neste nginx (ou no proxy à frente dele):
# add_header Strict-Transport-Security "max-age=63072000" always;
